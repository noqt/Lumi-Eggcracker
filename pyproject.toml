[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-eggcracker"
dynamic = ["version"]
description = "A native Linux cgroup-v2 kill switch for unapproved supported local-AI workloads"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["ai", "ai-security", "cgroups", "kill-switch", "linux", "local-ai", "process-containment", "runtime-security", "systemd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
eggcracker = "lumi_eggcracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "lumi_eggcracker.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_overhead.py" = ["E402"]
"scripts/install.py" = ["E402"]
"scripts/containment_probe.py" = ["E402"]
"scripts/uninstall.py" = ["E402"]
"scripts/verify_uninstalled.py" = ["E402"]
