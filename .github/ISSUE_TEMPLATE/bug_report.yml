name: Bug report
description: Report a reproducible Eggcracker defect (sign-in and repository permission required)
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: GitHub currently restricts issue creation in this repository, so this tracked form is not an anonymous feedback channel. If you have permission to open an issue, do not include credentials, private model files or sensitive exploit details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.5.0 or exact source commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux platform
      placeholder: Ubuntu 24.04, kernel version, systemd version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
