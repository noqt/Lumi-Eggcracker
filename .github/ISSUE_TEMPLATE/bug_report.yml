name: Bug report
description: Report a reproducible Eggcracker defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Lumi Eggcracker. Use this form only for a non-security defect reproduced on a disposable supported Linux host. Do not include credentials, private model files, raw process arguments or sensitive exploit details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.5.0 or exact source commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux platform
      placeholder: Ubuntu 24.04, kernel version, systemd version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or public inputs and include the smallest sequence that reproduces the result.
    validations:
      required: true
  - type: textarea
    id: support_bundle
    attributes:
      label: Redacted support-bundle details
      description: Paste only the relevant, reviewed fields from scripts/support_bundle.py. Never attach private model data, credentials, raw arguments or environments.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I reproduced this on a disposable machine I own or am authorised to administer.
          required: true
        - label: This report does not contain security-sensitive exploit details; I will use private vulnerability reporting if it does.
          required: true
