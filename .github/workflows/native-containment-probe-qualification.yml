name: Native containment-probe qualification (draft only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-containment-probe-qualification.yml

permissions:
  contents: read

concurrency:
  group: native-containment-probe-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-probe:
    if: >-
      github.repository == 'noqt/Lumi-Eggcracker' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qualification/containment-probe-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_COMMIT: a2b283c1658aa952dc2aaf6e29e15a9e6b48cb97
      CANDIDATE_TREE: 096a37751e0901d3e34528a720fec3c988d15361
      CANDIDATE_SOURCE_SHA256: 22d175cae00b639b11cd4ab95bdcb7e0bfcde133d58b294ce3ae297b653fae4b
    steps:
      - name: Check out the exact reviewed candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: a2b283c1658aa952dc2aaf6e29e15a9e6b48cb97

      - name: Bind the disposable native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(cat /proc/1/comm)" = systemd
          test ! -e /run/systemd/container
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test -f /sys/fs/cgroup/cgroup.controllers
          grep -qw pids /sys/fs/cgroup/cgroup.controllers
          test -d /sys/fs/cgroup/system.slice
          test -f /sys/fs/cgroup/system.slice/cgroup.kill
          sudo -n true
          for path in \
            /usr/local/lib/lumi-eggcracker \
            /usr/local/bin/eggcracker \
            /etc/lumi-eggcracker \
            /var/lib/lumi-eggcracker \
            /run/lumi-eggcracker \
            /run/lumi-eggcracker-watchdog \
            /etc/systemd/system/lumi-eggcracker.service \
            /etc/systemd/system/lumi-eggcracker-watchdog.service
          do
            test ! -e "$path"
          done
          printf 'NATIVE_HOST_OS=%s-%s\n' "$ID" "$VERSION_ID"
          printf 'NATIVE_KERNEL=%s\n' "$(uname -r)"
          printf 'NATIVE_SYSTEMD=%s\n' "$(systemd --version | head -n 1)"
          printf 'NATIVE_PYTHON=%s\n' "$(/usr/bin/python3 --version 2>&1)"
          printf 'NATIVE_IMAGE_OS=%s\n' "${ImageOS:-unavailable}"
          printf 'NATIVE_IMAGE_VERSION=%s\n' "${ImageVersion:-unavailable}"
          echo 'NATIVE_CGROUP=v2-system.slice-cgroup.kill'
          printf 'NATIVE_CANDIDATE_COMMIT=%s\n' "$CANDIDATE_COMMIT"
          printf 'NATIVE_CANDIDATE_TREE=%s\n' "$CANDIDATE_TREE"
          printf 'NATIVE_CANDIDATE_SOURCE_SHA256=%s\n' "$CANDIDATE_SOURCE_SHA256"

      - name: Run 100 exact containment probes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt_dir="$RUNNER_TEMP/lumi-eggcracker-native-receipts"
          mkdir -p "$receipt_dir"
          verifier="$RUNNER_TEMP/verify-containment-probe-receipt.py"
          cat > "$verifier" <<'PY'
          import json
          import sys

          expected_keys = {
              "canary_survived",
              "changes_made",
              "cleanup_complete",
              "descendant_cgroups_checked",
              "installation_performed",
              "journal_history_may_persist",
              "mode",
              "network_requests_made",
              "primitive",
              "result",
              "root_populated",
              "source_commit",
              "source_tree_sha256",
              "target_processes",
              "target_survivors",
              "trigger_to_empty_ms",
              "workload_detection_performed",
          }
          with open(sys.argv[1], encoding="utf-8") as handle:
              receipt = json.load(handle)
          assert set(receipt) == expected_keys
          assert receipt["canary_survived"] is True
          assert receipt["changes_made"] is True
          assert receipt["cleanup_complete"] is True
          assert receipt["descendant_cgroups_checked"] >= 1
          assert receipt["installation_performed"] is False
          assert receipt["journal_history_may_persist"] is True
          assert receipt["mode"] == "containment-primitive-probe"
          assert receipt["network_requests_made"] is False
          assert receipt["primitive"] == "pidfd-stop+cgroup.kill"
          assert receipt["result"] == "TERMINATED"
          assert receipt["root_populated"] == 0
          assert receipt["source_commit"] == sys.argv[2]
          assert receipt["source_tree_sha256"] == sys.argv[3]
          assert receipt["target_processes"] == 2
          assert receipt["target_survivors"] == 0
          assert receipt["trigger_to_empty_ms"] >= 0
          assert receipt["workload_detection_performed"] is False
          PY

          for iteration in $(seq 1 100)
          do
            receipt="$receipt_dir/sequential-$iteration.json"
            sudo -n /usr/bin/python3 -I -S scripts/containment_probe.py \
              --i-understand-this-kills-a-test-tree > "$receipt"
            /usr/bin/python3 -I -S "$verifier" \
              "$receipt" "$CANDIDATE_COMMIT" "$CANDIDATE_SOURCE_SHA256"
          done

          units="$(sudo -n systemctl list-units --all --plain --no-legend \
            'lumi-eggcracker-probe-*.service')" || {
            echo "Unable to enumerate residual probe units" >&2
            exit 1
          }
          if test -n "$units"; then
            echo "Residual probe unit found after sequential qualification" >&2
            exit 1
          fi
          cgroups="$(sudo -n find /sys/fs/cgroup/system.slice -mindepth 1 -maxdepth 1 \
            -type d -name 'lumi-eggcracker-probe-*.service' -print)" || {
            echo "Unable to enumerate residual probe cgroups" >&2
            exit 1
          }
          if test -n "$cgroups"; then
            echo "Residual probe cgroup found after sequential qualification" >&2
            exit 1
          fi
          echo "NATIVE_SEQUENTIAL_RESULT=100/100"
          echo "NATIVE_SEQUENTIAL_CANARY_SURVIVALS=100/100"
          echo "NATIVE_SEQUENTIAL_CLEANUPS=100/100"
          echo "NATIVE_SEQUENTIAL_TARGET_SURVIVORS=0/200"
          echo "NATIVE_SEQUENTIAL_RESIDUAL_UNITS=0"
          echo "NATIVE_SEQUENTIAL_RESIDUAL_CGROUPS=0"

      - name: Run concurrent and forced-collision cases
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt_dir="$RUNNER_TEMP/lumi-eggcracker-native-concurrency"
          mkdir -p "$receipt_dir"
          verifier="$RUNNER_TEMP/verify-containment-probe-receipt.py"

          pids=()
          for instance in 1 2
          do
            sudo -n /usr/bin/python3 -I -S scripts/containment_probe.py \
              --i-understand-this-kills-a-test-tree > "$receipt_dir/concurrent-$instance.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"
          do
            wait "$pid"
          done
          for instance in 1 2
          do
            /usr/bin/python3 -I -S "$verifier" \
              "$receipt_dir/concurrent-$instance.json" \
              "$CANDIDATE_COMMIT" "$CANDIDATE_SOURCE_SHA256"
          done

          token=ffffffffffffffffffffffffffffffff
          unit="lumi-eggcracker-probe-$token.service"
          cleanup_collision() {
            sudo systemctl stop "$unit" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "$unit" >/dev/null 2>&1 || true
          }
          trap cleanup_collision EXIT
          sudo systemd-run --quiet \
            --unit="$unit" \
            --service-type=exec \
            --property=PrivateNetwork=yes \
            --property=RestrictAddressFamilies=AF_UNIX \
            --property=NoNewPrivileges=yes \
            --property=KillMode=control-group \
            --property=TimeoutStopSec=3s \
            /usr/bin/python3 -I -S -c 'import time; time.sleep(45)'
          sudo systemctl is-active --quiet "$unit"

          sudo -n /usr/bin/python3 -I -S - "$token" <<'PY'
          import sys
          from pathlib import Path
          from unittest.mock import patch

          sys.path.insert(0, str(Path.cwd() / "src"))
          from lumi_eggcracker import containment_probe as probe

          with patch.object(probe.secrets, "token_hex", return_value=sys.argv[1]):
              try:
                  probe.run_probe(acknowledged=True)
              except probe.ProbeError as error:
                  if error.code != "UNIT_COLLISION":
                      raise
              else:
                  raise AssertionError("forced unit collision returned success")
          PY
          sudo systemctl is-active --quiet "$unit"
          cleanup_collision
          trap - EXIT

          units="$(sudo -n systemctl list-units --all --plain --no-legend \
            'lumi-eggcracker-probe-*.service')" || {
            echo "Unable to enumerate residual probe units" >&2
            exit 1
          }
          if test -n "$units"; then
            echo "Residual probe unit found after concurrency qualification" >&2
            exit 1
          fi
          cgroups="$(sudo -n find /sys/fs/cgroup/system.slice -mindepth 1 -maxdepth 1 \
            -type d -name 'lumi-eggcracker-probe-*.service' -print)" || {
            echo "Unable to enumerate residual probe cgroups" >&2
            exit 1
          }
          if test -n "$cgroups"; then
            echo "Residual probe cgroup found after concurrency qualification" >&2
            exit 1
          fi
          echo "NATIVE_CONCURRENCY_RESULT=2/2"
          echo "NATIVE_CONCURRENT_CANARY_SURVIVALS=2/2"
          echo "NATIVE_CONCURRENT_CLEANUPS=2/2"
          echo "NATIVE_CONCURRENT_TARGET_SURVIVORS=0/4"
          echo "NATIVE_COLLISION_RESULT=1/1_EXPECTED_FAIL_CLOSED"
          echo "NATIVE_COLLISION_INCUMBENT_SURVIVALS=1/1"
          echo "NATIVE_FINAL_RESIDUAL_UNITS=0"
          echo "NATIVE_FINAL_RESIDUAL_CGROUPS=0"

      - name: Prepare reviewed interruption and fault harness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          harness="$RUNNER_TEMP/containment-probe-native-matrix.py"
          cat > "$harness" <<'PY'
          import argparse
          import hashlib
          import json
          import os
          import signal
          import subprocess
          import sys
          import time
          from contextlib import ExitStack
          from pathlib import Path
          from unittest.mock import patch

          sys.path.insert(0, str(Path.cwd() / "src"))
          from lumi_eggcracker import containment_probe as probe

          STAGES = {
              "owner-capture": ("_capture_owner", 1),
              "pidfd-binding": ("open_pidfd", 2),
              "stop": ("stop_pidfd", 1),
              "kill": ("kill_path", 1),
              "empty-proof": ("_strict_empty", 1),
              "cleanup": ("_cleanup", 1),
          }


          def exact_token(mode: str, stage: str, position: str) -> str:
              material = f"{mode}:{stage}:{position}".encode("ascii")
              return hashlib.sha256(material).hexdigest()[:32]


          def serialized_identity(value: object | None) -> dict[str, int] | None:
              if value is None:
                  return None
              return {"pid": value.pid, "start_time": value.start_time}


          def write_state(
              path: Path | None,
              mode: str,
              stage: str,
              position: str,
              unit: str,
              canary: object | None,
              targets: list[object],
          ) -> None:
              if path is None:
                  return
              path.write_text(
                  json.dumps(
                      {
                          "canary": serialized_identity(canary),
                          "mode": mode,
                          "position": position,
                          "schema": "lumi-eggcracker.forced-orchestrator.v1",
                          "stage": stage,
                          "targets": [serialized_identity(value) for value in targets],
                          "unit": unit,
                      },
                      sort_keys=True,
                  ),
                  encoding="ascii",
              )
              path.chmod(0o600)


          def emergency_cleanup(unit: str, processes: list[subprocess.Popen[bytes]]) -> None:
              subprocess.run(
                  [str(probe.SYSTEMCTL), "stop", unit],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=4.0,
                  check=False,
              )
              subprocess.run(
                  [str(probe.SYSTEMCTL), "reset-failed", unit],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=4.0,
                  check=False,
              )
              for process in processes:
                  if process.poll() is None:
                      process.kill()
                  try:
                      process.wait(timeout=2.0)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=2.0)


          def run_case(
              mode: str,
              stage: str,
              position: str,
              state_path: Path | None,
              marker_path: Path | None,
          ) -> None:
              attribute, injection_ordinal = STAGES[stage]
              original_stage = getattr(probe, attribute)
              original_canary = probe._spawn_canary
              original_spawn_target = probe._spawn_target
              original_wait_target = probe._wait_target
              token = exact_token(mode, stage, position)
              unit = f"lumi-eggcracker-probe-{token}.service"
              tracked_processes: list[subprocess.Popen[bytes]] = []
              canary_identity: object | None = None
              target_identities: list[object] = []
              invocation_count = 0

              def tracked_canary() -> tuple[subprocess.Popen[bytes], object, int]:
                  nonlocal canary_identity
                  result = original_canary()
                  tracked_processes.append(result[0])
                  canary_identity = result[1]
                  write_state(
                      state_path,
                      mode,
                      stage,
                      position,
                      unit,
                      canary_identity,
                      target_identities,
                  )
                  return result

              def tracked_spawn_target(*args: object, **kwargs: object) -> subprocess.Popen[bytes]:
                  result = original_spawn_target(*args, **kwargs)
                  tracked_processes.append(result)
                  return result

              def tracked_wait_target(*args: object, **kwargs: object) -> tuple[object, object]:
                  nonlocal target_identities
                  result = original_wait_target(*args, **kwargs)
                  target_identities = list(result)
                  write_state(
                      state_path,
                      mode,
                      stage,
                      position,
                      unit,
                      canary_identity,
                      target_identities,
                  )
                  return result

              def inject() -> None:
                  if mode == "interrupt":
                      os.kill(os.getpid(), signal.SIGTERM)
                      return
                  if mode == "fault":
                      raise probe.ProbeError("INJECTED_FAULT")
                  if mode == "orchestrator":
                      if marker_path is None:
                          raise AssertionError("marker required")
                      marker_path.write_text("ready\n", encoding="ascii")
                      marker_path.chmod(0o600)
                      time.sleep(120)
                      raise AssertionError("orchestrator was not terminated")
                  raise AssertionError("unknown mode")

              def staged(*args: object, **kwargs: object) -> object:
                  nonlocal invocation_count
                  invocation_count += 1
                  inject_now = invocation_count == injection_ordinal
                  if inject_now and position == "before":
                      inject()
                  result = original_stage(*args, **kwargs)
                  if inject_now and position == "after":
                      inject()
                  return result

              write_state(
                  state_path,
                  mode,
                  stage,
                  position,
                  unit,
                  canary_identity,
                  target_identities,
              )
              with ExitStack() as stack:
                  stack.enter_context(patch.object(probe.secrets, "token_hex", return_value=token))
                  stack.enter_context(patch.object(probe, "_spawn_canary", side_effect=tracked_canary))
                  stack.enter_context(
                      patch.object(probe, "_spawn_target", side_effect=tracked_spawn_target)
                  )
                  stack.enter_context(patch.object(probe, "_wait_target", side_effect=tracked_wait_target))
                  stack.enter_context(patch.object(probe, attribute, side_effect=staged))
                  try:
                      receipt = probe.run_probe(acknowledged=True)
                  except probe.ProbeError as error:
                      if mode == "interrupt" and error.code != "INTERRUPTED":
                          raise
                      if mode == "fault":
                          expected = "CLEANUP_INCOMPLETE" if stage == "cleanup" else "INJECTED_FAULT"
                          if error.code != expected:
                              raise
                  else:
                      raise AssertionError(f"{mode}:{stage}:{position} returned success: {receipt}")
                  finally:
                      if mode == "fault" and stage == "cleanup" and position == "before":
                          emergency_cleanup(unit, tracked_processes)
                  if mode in {"fault", "interrupt"}:
                      identities = [canary_identity, *target_identities]
                      for value in identities:
                          if value is None:
                              continue
                          absence_deadline = time.monotonic() + 2.0
                          while (
                              probe.identity(value.pid) == value
                              and time.monotonic() < absence_deadline
                          ):
                              time.sleep(0.01)
                          if probe.identity(value.pid) == value:
                              raise AssertionError("original bounded process survived cleanup")


          parser = argparse.ArgumentParser()
          parser.add_argument("mode", choices=("fault", "interrupt", "orchestrator"))
          parser.add_argument("stage", choices=tuple(STAGES))
          parser.add_argument("position", choices=("before", "after"))
          parser.add_argument("--state", type=Path)
          parser.add_argument("--marker", type=Path)
          arguments = parser.parse_args()
          run_case(arguments.mode, arguments.stage, arguments.position, arguments.state, arguments.marker)
          PY
          /usr/bin/python3 -I -S -m py_compile "$harness"

          supervisor="$RUNNER_TEMP/forced-orchestrator-supervisor.py"
          cat > "$supervisor" <<'PY'
          import os
          import select
          import signal
          import subprocess
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))
          from lumi_eggcracker import containment_probe as probe


          def run() -> None:
              if len(sys.argv) != 7:
                  raise RuntimeError("invalid supervisor arguments")
              harness, stage, position, state_raw, marker_raw, result_raw = sys.argv[1:]
              state = Path(state_raw)
              marker = Path(marker_raw)
              result = Path(result_raw)
              process: subprocess.Popen[bytes] | None = None
              bound_identity = None
              descriptor: int | None = None
              try:
                  process = subprocess.Popen(
                      [
                          "/usr/bin/python3",
                          "-I",
                          "-S",
                          harness,
                          "orchestrator",
                          stage,
                          position,
                          "--state",
                          str(state),
                          "--marker",
                          str(marker),
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      close_fds=True,
                      env={"LANG": "C.UTF-8", "PATH": "/usr/bin:/bin"},
                  )
                  identity_deadline = time.monotonic() + 3.0
                  while time.monotonic() < identity_deadline:
                      if process.poll() is not None:
                          raise RuntimeError("orchestrator exited before identity binding")
                      bound_identity = probe.identity(process.pid)
                      if bound_identity is not None:
                          break
                      time.sleep(0.01)
                  if bound_identity is None:
                      raise RuntimeError("orchestrator identity unavailable")
                  descriptor = probe.open_pidfd(bound_identity)
                  if process.poll() is not None or probe.identity(bound_identity.pid) != bound_identity:
                      raise RuntimeError("orchestrator identity drifted before readiness")

                  marker_deadline = time.monotonic() + 25.0
                  while time.monotonic() < marker_deadline:
                      if process.poll() is not None:
                          raise RuntimeError("orchestrator exited before kill point")
                      if marker.stat().st_size > 0:
                          break
                      time.sleep(0.05)
                  else:
                      raise RuntimeError("orchestrator kill point timeout")

                  if process.poll() is not None or probe.identity(bound_identity.pid) != bound_identity:
                      raise RuntimeError("orchestrator identity drifted before signal")
                  signal.pidfd_send_signal(descriptor, signal.SIGKILL)
                  poller = select.poll()
                  poller.register(descriptor, select.POLLIN)
                  if not poller.poll(5000):
                      raise RuntimeError("orchestrator pidfd exit timeout")
                  return_code = process.wait(timeout=2.0)
                  if return_code != -signal.SIGKILL:
                      raise RuntimeError("orchestrator did not exit by SIGKILL")
                  result.write_text("SIGKILL_CONFIRMED\n", encoding="ascii")
                  result.chmod(0o600)
              finally:
                  cleanup_failed = False
                  try:
                      if process is not None and process.poll() is None:
                          if descriptor is None and bound_identity is not None:
                              try:
                                  if probe.identity(bound_identity.pid) == bound_identity:
                                      descriptor = probe.open_pidfd(bound_identity)
                              except BaseException:
                                  descriptor = None
                          signalled_by_pidfd = False
                          if descriptor is not None:
                              try:
                                  signal.pidfd_send_signal(descriptor, signal.SIGKILL)
                                  signalled_by_pidfd = True
                              except ProcessLookupError:
                                  pass
                              except OSError:
                                  pass
                          if process.poll() is None and not signalled_by_pidfd:
                              try:
                                  process.kill()
                              except ProcessLookupError:
                                  pass
                              except OSError:
                                  cleanup_failed = True
                          try:
                              process.wait(timeout=2.0)
                          except subprocess.TimeoutExpired:
                              try:
                                  process.kill()
                              except ProcessLookupError:
                                  pass
                              except OSError:
                                  cleanup_failed = True
                              try:
                                  process.wait(timeout=2.0)
                              except subprocess.TimeoutExpired:
                                  cleanup_failed = True
                          if process.poll() is None:
                              cleanup_failed = True
                  finally:
                      if descriptor is not None:
                          os.close(descriptor)
                  if cleanup_failed:
                      raise RuntimeError("direct child exit was not confirmed")


          try:
              run()
          except BaseException:
              raise SystemExit(1)
          PY
          /usr/bin/python3 -I -S -m py_compile "$supervisor"

      - name: Run interrupt and deterministic-fault matrices
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/containment-probe-native-matrix.py"
          stages=(owner-capture pidfd-binding stop kill empty-proof cleanup)
          positions=(before after)

          assert_no_residuals() {
            local units cgroups
            units="$(sudo -n systemctl list-units --all --plain --no-legend \
              'lumi-eggcracker-probe-*.service')" || return 1
            test -z "$units"
            cgroups="$(sudo -n find /sys/fs/cgroup/system.slice -mindepth 1 -maxdepth 1 \
              -type d -name 'lumi-eggcracker-probe-*.service' -print)" || return 1
            test -z "$cgroups"
          }

          for mode in interrupt fault
          do
            for stage in "${stages[@]}"
            do
              for position in "${positions[@]}"
              do
                sudo -n /usr/bin/python3 -I -S "$harness" "$mode" "$stage" "$position"
                assert_no_residuals
              done
            done
          done
          echo "NATIVE_INTERRUPT_FAIL_CLOSED=12/12"
          echo "NATIVE_INTERRUPT_ORIGINAL_WORKER_SURVIVORS=0"
          echo "NATIVE_INTERRUPT_RESIDUAL_UNITS=0"
          echo "NATIVE_INTERRUPT_RESIDUAL_CGROUPS=0"
          echo "NATIVE_DETERMINISTIC_FAULT_FAIL_CLOSED=12/12"
          echo "NATIVE_DETERMINISTIC_FAULT_ORIGINAL_WORKER_SURVIVORS=0"
          echo "NATIVE_DETERMINISTIC_FAULT_RESIDUAL_UNITS=0"
          echo "NATIVE_DETERMINISTIC_FAULT_RESIDUAL_CGROUPS=0"

      - name: Run forced-orchestrator termination matrix
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          harness="$RUNNER_TEMP/containment-probe-native-matrix.py"
          supervisor="$RUNNER_TEMP/forced-orchestrator-supervisor.py"
          case_dir="$RUNNER_TEMP/lumi-eggcracker-orchestrator-cases"
          mkdir -p "$case_dir"
          stages=(owner-capture pidfd-binding stop kill empty-proof cleanup)
          positions=(before after)
          outer_pids=()
          state_files=()
          marker_files=()
          result_files=()

          for stage in "${stages[@]}"
          do
            for position in "${positions[@]}"
            do
              name="$stage-$position"
              state_file="$case_dir/$name.state.json"
              marker_file="$case_dir/$name.marker"
              result_file="$case_dir/$name.result"
              : > "$state_file"
              : > "$marker_file"
              : > "$result_file"
              chmod 0600 "$state_file" "$marker_file" "$result_file"
              sudo -n /usr/bin/python3 -I -S "$supervisor" \
                "$harness" "$stage" "$position" "$state_file" "$marker_file" "$result_file" \
                > /dev/null 2>&1 &
              outer_pids+=("$!")
              state_files+=("$state_file")
              marker_files+=("$marker_file")
              result_files+=("$result_file")
            done
          done

          wait_failure=0
          for outer_pid in "${outer_pids[@]}"
          do
            if ! wait "$outer_pid"; then
              wait_failure=1
            fi
          done
          if (( wait_failure != 0 )); then
            echo "Forced-orchestrator supervisor failed" >&2
            exit 1
          fi
          for result_file in "${result_files[@]}"; do
            test "$(<"$result_file")" = "SIGKILL_CONFIRMED"
          done

          sleep 50
          if ! sudo -n /usr/bin/python3 -I -S - "${state_files[@]}" > /dev/null 2>&1 <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "src"))
          from lumi_eggcracker.discovery import ProcessIdentity, identity

          expected_keys = {"canary", "mode", "position", "schema", "stage", "targets", "unit"}
          expected_stages = {"owner-capture", "pidfd-binding", "stop", "kill", "empty-proof", "cleanup"}
          seen = set()

          def exact_identity(raw: object) -> ProcessIdentity:
              if not isinstance(raw, dict) or set(raw) != {"pid", "start_time"}:
                  raise RuntimeError("invalid identity schema")
              pid = raw["pid"]
              start_time = raw["start_time"]
              if type(pid) is not int or type(start_time) is not int or pid < 1 or start_time < 1:
                  raise RuntimeError("invalid identity value")
              return ProcessIdentity(pid, start_time)

          for raw in sys.argv[1:]:
              state = json.loads(Path(raw).read_text(encoding="ascii"))
              if not isinstance(state, dict) or set(state) != expected_keys:
                  raise RuntimeError("invalid forced-state schema")
              if state["schema"] != "lumi-eggcracker.forced-orchestrator.v1":
                  raise RuntimeError("invalid forced-state version")
              if state["mode"] != "orchestrator":
                  raise RuntimeError("invalid forced-state mode")
              stage = state["stage"]
              position = state["position"]
              if stage not in expected_stages or position not in {"before", "after"}:
                  raise RuntimeError("invalid forced-state case")
              case = (stage, position)
              if case in seen:
                  raise RuntimeError("duplicate forced-state case")
              seen.add(case)
              token = hashlib.sha256(f"orchestrator:{stage}:{position}".encode("ascii")).hexdigest()[:32]
              if state["unit"] != f"lumi-eggcracker-probe-{token}.service":
                  raise RuntimeError("invalid forced-state unit")
              targets_raw = state["targets"]
              if not isinstance(targets_raw, list):
                  raise RuntimeError("invalid target identity list")
              if stage == "owner-capture":
                  if state["canary"] is not None or targets_raw:
                      raise RuntimeError("invalid owner-capture state")
                  identities = []
              else:
                  if state["canary"] is None or len(targets_raw) != 2:
                      raise RuntimeError("incomplete bounded-worker state")
                  identities = [exact_identity(state["canary"]), *map(exact_identity, targets_raw)]
              for value in identities:
                  if identity(value.pid) == value:
                      raise RuntimeError("original bounded worker survived")
          if len(seen) != 12:
              raise RuntimeError("incomplete forced-state matrix")
          PY
          then
            echo "Forced-orchestrator private-state verification failed" >&2
            exit 1
          fi
          units="$(sudo -n systemctl list-units --all --plain --no-legend \
            'lumi-eggcracker-probe-*.service')" || {
            echo "Unable to enumerate forced-termination units" >&2
            exit 1
          }
          test -z "$units"
          cgroups="$(sudo -n find /sys/fs/cgroup/system.slice -mindepth 1 -maxdepth 1 \
            -type d -name 'lumi-eggcracker-probe-*.service' -print)" || {
            echo "Unable to enumerate forced-termination cgroups" >&2
            exit 1
          }
          test -z "$cgroups"
          echo "NATIVE_FORCED_ORCHESTRATOR_TERMINATIONS=12/12"
          echo "NATIVE_FORCED_ORCHESTRATOR_SIGKILL_CONFIRMATIONS=12/12"
          echo "NATIVE_FORCED_ORCHESTRATOR_ORIGINAL_WORKER_SURVIVORS=0"
          echo "NATIVE_FORCED_ORCHESTRATOR_RESIDUAL_UNITS=0"
          echo "NATIVE_FORCED_ORCHESTRATOR_RESIDUAL_CGROUPS=0"
