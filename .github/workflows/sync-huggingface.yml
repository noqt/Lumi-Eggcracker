name: Sync Hugging Face distribution

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-distribution-sync
  cancel-in-progress: false

jobs:
  sync:
    name: mirror-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build the revision-bound distribution snapshot
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python scripts/build_huggingface_surface.py
          --source-root .
          --output .hf-staging
          --source-revision "${{ github.sha }}"

      - name: Install the pinned Hugging Face CLI
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: python -m pip install huggingface_hub==1.7.1

      - name: Require the repository-scoped Hub credential
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::Missing HF_TOKEN: add a write token scoped only to noqt/eggcracker."
            exit 1
          fi

      - name: Mirror the snapshot to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload noqt/eggcracker .hf-staging .
          --repo-type space
          --delete="*"
          --commit-message="Sync GitHub main ${{ github.sha }}"
          --commit-description="Canonical source: https://github.com/noqt/Lumi-Eggcracker/commit/${{ github.sha }}"

      - name: Verify the complete remote file set and checksums
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf cache verify noqt/eggcracker
          --repo-type space
          --revision main
          --local-dir .hf-staging
          --fail-on-missing-files
          --fail-on-extra-files
