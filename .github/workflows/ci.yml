name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  monitoring-consumer:
    name: monitoring-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify pinned test-only tools and replay monitoring journey
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --quiet HEAD --
          task_temp=$(mktemp -d "$RUNNER_TEMP/eggcracker-monitoring.XXXXXX")
          task_temp=$(cd "$task_temp" && pwd -P)
          export TEMP="$task_temp" TMP="$task_temp" TMPDIR="$task_temp"
          export PYTHONDONTWRITEBYTECODE=1
          export EGGCRACKER_NODE_EXPORTER="$task_temp/node_exporter/node_exporter"
          export EGGCRACKER_PROMTOOL="$task_temp/prometheus/promtool"
          python -I -S -B - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import sys
          import tarfile
          import tempfile
          from urllib.request import urlopen

          root = Path(os.environ["TMPDIR"]).resolve()
          assert sys.platform == "linux" and os.geteuid() != 0
          assert Path(tempfile.gettempdir()).resolve() == root
          print(f"MONITORING_PREFLIGHT sha={os.environ['GITHUB_SHA']} uid={os.geteuid()} python={sys.version.split()[0]}", flush=True)
          tools = (
              ("node_exporter", "1.12.1", "node_exporter", 12168577,
               "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"),
              ("prometheus", "3.14.0", "promtool", 107111714,
               "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d"),
          )
          for project, version, binary, size, expected in tools:
              prefix = f"{project}-{version}.linux-amd64"
              url = f"https://github.com/prometheus/{project}/releases/download/v{version}/{prefix}.tar.gz"
              with urlopen(url, timeout=60) as response:
                  data = response.read(size + 1)
              assert len(data) == size and hashlib.sha256(data).hexdigest() == expected
              print(f"MONITORING_TOOL_ARCHIVE {project} {version} SHA256={expected}", flush=True)
              destination = root / project
              destination.mkdir()
              # Extract only individually allowlisted regular members, never tar paths.
              # Retain complete upstream Apache-2.0 LICENSE and NOTICE beside each tool.
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                  members = archive.getmembers()
                  for name in (binary, "LICENSE", "NOTICE"):
                      matches = [member for member in members if member.name == f"{prefix}/{name}"]
                      assert len(matches) == 1
                      member = matches[0]
                      assert member.isfile() and 0 < member.size <= 256 * 1024 * 1024
                      source = archive.extractfile(member)
                      assert source is not None
                      with source:
                          content = source.read(member.size + 1)
                      assert len(content) == member.size
                      target = destination / name
                      with target.open("xb") as output:
                          output.write(content)
                      target.chmod(0o700 if name == binary else 0o600)
                      print(f"MONITORING_TOOL_MEMBER {project}/{name} SHA256={hashlib.sha256(content).hexdigest()}", flush=True)
          PY
          "$EGGCRACKER_NODE_EXPORTER" --version
          "$EGGCRACKER_PROMTOOL" --version
          export EGGCRACKER_REAL_CONSUMERS=1
          python -m unittest discover -s tests -p 'test_monitoring*.py' -v
          git diff --no-ext-diff --quiet HEAD --
          echo 'MONITORING_TRACKED_INTEGRITY=PASS'

  hosted-proof-windows:
    name: hosted-proof-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Test the cross-platform hosted-proof helper
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_hosted_proof.py -v

  receipt-action-consumer:
    name: receipt-action-consumer
    uses: ./.github/workflows/validate-hosted-proof-receipt.yml
    with:
      receipt: schemas/examples/hosted-proof-receipt-v1-success.json

  test-and-package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install jsonschema==4.26.0 ruff==0.16.1 PyYAML==6.0.3

      - name: Replay the local hosted-proof receipt action
        if: matrix.python-version == '3.11'
        uses: ./actions/validate-hosted-proof-receipt
        with:
          receipt: schemas/examples/hosted-proof-receipt-v1-success.json

      - name: Lint
        if: matrix.python-version == '3.11'
        run: ruff check src tests scripts

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          check_integrity() {
            original_status=$?
            trap - EXIT
            integrity_status=0
            git diff --no-ext-diff --quiet HEAD -- || integrity_status=$?
            if [ "$integrity_status" -eq 0 ]; then
              echo 'UNIT_TRACKED_INTEGRITY=PASS'
            else
              echo 'UNIT_TRACKED_INTEGRITY=FAIL'
            fi
            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            exit "$integrity_status"
          }
          trap check_integrity EXIT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --no-ext-diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard -- src scripts tests docs)"
          task_temp=$(mktemp -d "$RUNNER_TEMP/eggcracker-unit.XXXXXX")
          task_temp=$(cd "$task_temp" && pwd -P)
          export TEMP="$task_temp" TMP="$task_temp" TMPDIR="$task_temp"
          export PYTHONPYCACHEPREFIX="$task_temp/pycache"
          mkdir "$PYTHONPYCACHEPREFIX"
          python -I -S -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          import tempfile

          assert sys.platform == "linux" and os.geteuid() != 0
          assert Path(tempfile.gettempdir()).resolve() == Path(os.environ["TMPDIR"]).resolve()
          for directory in ("src", "scripts", "tests"):
              assert not list(Path(directory).rglob("*.pyc")), "pre-existing source bytecode"
          for name in (
              "docs/security-control-handoff.md",
              "tests/test_security_control_handoff_contract.py",
              "tests/test_security_control_handoff_replay.py",
          ):
              print(f"UNIT_SOURCE_SHA256 {name} {hashlib.sha256(Path(name).read_bytes()).hexdigest()}")
          print(f"UNIT_PREFLIGHT sha={os.environ['GITHUB_SHA']} uid={os.geteuid()} "
                f"python={sys.version.split()[0]} TMPDIR={os.environ['TMPDIR']}", flush=True)
          PY
          test "$(id -u)" -ne 0
          python -m unittest discover -s tests -v

      - name: Build release artifacts
        if: matrix.python-version == '3.11'
        run: python scripts/build_release.py --output dist/github

      - name: Determine public version
        if: matrix.python-version == '3.11'
        id: version
        shell: bash
        run: echo "version=$(PYTHONPATH=src python -c 'from lumi_eggcracker import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Verify public release
        if: matrix.python-version == '3.11'
        run: >-
          python scripts/verify_release.py
          --artifact dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}.pyz
          --source-archive dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}-source.zip
          --release-bundle dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}-linux.zip

      - name: Upload tag artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.python-version == '3.11'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lumi-eggcracker-${{ github.ref_name }}
          path: |
            dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}.pyz
            dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}-source.zip
            dist/github/lumi-eggcracker-${{ steps.version.outputs.version }}-linux.zip
            dist/github/release-manifest.json
            dist/github/SHA256SUMS
          if-no-files-found: error
