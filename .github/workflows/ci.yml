name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: python -m pip install ruff==0.16.1

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build release artifacts
        run: python scripts/build_release.py --output dist/github

      - name: Verify public release
        run: >-
          python scripts/verify_release.py
          --artifact dist/github/lumi-eggcracker-0.1.1.pyz
          --source-archive dist/github/lumi-eggcracker-0.1.1-source.zip
          --release-bundle dist/github/lumi-eggcracker-0.1.1-linux.zip

      - name: Upload tag artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: lumi-eggcracker-${{ github.ref_name }}
          path: |
            dist/github/lumi-eggcracker-0.1.1.pyz
            dist/github/lumi-eggcracker-0.1.1-source.zip
            dist/github/lumi-eggcracker-0.1.1-linux.zip
            dist/github/release-manifest.json
            dist/github/SHA256SUMS
          if-no-files-found: error
